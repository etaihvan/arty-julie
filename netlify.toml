[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Change to the final domain once it's connected (used for canonical URLs and the sitemap).
  SITE_URL = "https://kidsartclasses.info"

# Every page is pre-rendered to its own HTML file, so no SPA catch-all is needed
# and unknown URLs correctly get the custom 404 page (dist/404.html).

# ---- Old WordPress URLs → new pages (keeps bookmarks and search rankings) ----
[[redirects]]
  from = "/teen-art"
  to = "/kids-art-classes/#teens"
  status = 301
[[redirects]]
  from = "/teen-art/*"
  to = "/kids-art-classes/#teens"
  status = 301
[[redirects]]
  from = "/summer-art-camp"
  to = "/art-camps/"
  status = 301
[[redirects]]
  from = "/summer-art-camp/*"
  to = "/art-camps/"
  status = 301
[[redirects]]
  from = "/spring-art-camp"
  to = "/art-camps/"
  status = 301
[[redirects]]
  from = "/spring-art-camp/*"
  to = "/art-camps/"
  status = 301
[[redirects]]
  from = "/winter-art-camp"
  to = "/art-camps/"
  status = 301
[[redirects]]
  from = "/winter-art-camp/*"
  to = "/art-camps/"
  status = 301
[[redirects]]
  from = "/bio"
  to = "/about/"
  status = 301
[[redirects]]
  from = "/bio/*"
  to = "/about/"
  status = 301
[[redirects]]
  from = "/application"
  to = "/contact/#register"
  status = 301
[[redirects]]
  from = "/application/*"
  to = "/contact/#register"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
